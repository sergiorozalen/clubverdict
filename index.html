<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Pick any LaLiga or Premier League club and get a data-driven verdict: luck vs expected points, season outlook, next match, squad age curve and value for money.">
<meta property="og:title" content="Club Verdict">
<meta property="og:description" content="Pick your club. Get the verdict: what's working, what's worrying, and whether the table is lying.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%231E6B45'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23F3F0E8'/%3E%3C/svg%3E">
<title>Club Verdict</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F0E8; --card:#FBFAF6; --ink:#14201A; --muted:#5E6A62; --line:#DAD5C8;
  --pitch:#1E6B45; --pitch-soft:#DCEBDF; --amber:#C98A12; --amber-soft:#F5E6C4;
  --red:#B8402C; --red-soft:#F3D9D2; --blue:#2F5E8C; --grey:#9AA39C;
  --shadow:0 1px 0 rgba(20,32,26,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1512; --card:#161E1A; --ink:#ECEAE3; --muted:#9BA69F; --line:#2A342F;
    --pitch:#4FB482; --pitch-soft:#1D3328; --amber:#E3AE45; --amber-soft:#3A2F17;
    --red:#E0735E; --red-soft:#3C211C; --blue:#7FA9D6; --grey:#5F6A64; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1512; --card:#161E1A; --ink:#ECEAE3; --muted:#9BA69F; --line:#2A342F;
  --pitch:#4FB482; --pitch-soft:#1D3328; --amber:#E3AE45; --amber-soft:#3A2F17;
  --red:#E0735E; --red-soft:#3C211C; --blue:#7FA9D6; --grey:#5F6A64; --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:Barlow,system-ui,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3,.disp{font-family:"Barlow Condensed",Barlow,sans-serif;letter-spacing:.01em;margin:0}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
/* top bar */
.bar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;gap:12px;align-items:center;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
.brand{font-family:"Barlow Condensed";font-weight:800;font-size:20px;text-transform:uppercase;letter-spacing:.06em;margin-right:auto;display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--pitch);box-shadow:inset 0 0 0 3px var(--paper),0 0 0 1.5px var(--pitch)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--card)}
.seg button{border:0;background:none;color:var(--muted);font:600 14px Barlow;padding:6px 12px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
select{font:600 15px Barlow;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 30px 8px 12px;appearance:none;max-width:100%;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 16px) 55%,calc(100% - 11px) 55%;background-size:5px 5px;background-repeat:no-repeat}
/* hero */
.hero{padding:28px 0 18px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:end}
.eyebrow{font:600 13px Barlow;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.hero h1{font-size:clamp(40px,8vw,76px);font-weight:800;line-height:.92;text-transform:uppercase;margin:6px 0 10px}
.verdict-line{font-family:"Barlow Condensed";font-size:clamp(22px,3.4vw,30px);font-weight:600;line-height:1.1}
.verdict-line b{color:var(--pitch)}
.posbox{text-align:right}
.posbox .big{font-family:"Barlow Condensed";font-weight:800;font-size:clamp(56px,10vw,96px);line-height:.85}
.posbox .big sup{font-size:.35em;vertical-align:top;margin-left:2px}
.record{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;color:var(--muted);font-size:15px;align-items:center}
.record b{color:var(--ink)}
.form{display:inline-flex;gap:4px}
.form span{width:22px;height:22px;border-radius:5px;display:grid;place-items:center;font:700 12px Barlow;color:#fff}
.form .W{background:var(--pitch)} .form .D{background:var(--grey)} .form .L{background:var(--red)}
/* verdict cards */
.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:6px 0 26px}
.vcol h3{font-size:15px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.vcol h3::before{content:"";width:10px;height:10px;border-radius:2px;background:currentColor}
.vcol.good h3{color:var(--pitch)} .vcol.bad h3{color:var(--red)}
.pt{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--pitch);border-radius:10px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.bad .pt{border-left-color:var(--red)}
.pt b{display:block;font-family:"Barlow Condensed";font-size:20px;font-weight:700;line-height:1.1;margin-bottom:2px}
.pt p{margin:0;color:var(--muted);font-size:15px}
.empty{color:var(--muted);font-style:italic;padding:8px 2px}
/* sections */
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;margin-bottom:28px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);min-width:0}
.s6{grid-column:span 6}.s4{grid-column:span 4}.s8{grid-column:span 8}.s12{grid-column:span 12}.s5{grid-column:span 5}.s7{grid-column:span 7}
.card h2{font-size:24px;font-weight:700;text-transform:uppercase;line-height:1}
.card .sub{color:var(--muted);font-size:14px;margin:4px 0 14px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{border-top:2px solid var(--ink);padding-top:6px}
.kpi .v{font-family:"Barlow Condensed";font-size:34px;font-weight:700;line-height:1}
.kpi .l{font-size:13px;color:var(--muted)}
.callout{margin-top:14px;padding:10px 12px;border-radius:8px;font-size:15px}
.callout.g{background:var(--pitch-soft)} .callout.r{background:var(--red-soft)} .callout.a{background:var(--amber-soft)}
/* rank ladder */
.ladder{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;margin-top:14px}
.ladder .lab{font-size:14px;color:var(--muted);white-space:nowrap}
.track{position:relative;height:26px;background:repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px calc(100%/20));border-radius:4px;border:1px solid var(--line)}
.track .dot{position:absolute;top:50%;transform:translate(-50%,-50%);width:26px;height:22px;border-radius:5px;background:var(--ink);color:var(--paper);font:700 13px Barlow;display:grid;place-items:center}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);grid-column:2}
/* outlook bars */
.ob{display:grid;grid-template-columns:130px 1fr 52px;gap:8px;align-items:center;margin:7px 0;font-size:15px}
.ob .t{height:14px;background:var(--paper);border-radius:3px;overflow:hidden;border:1px solid var(--line)}
.ob .f{height:100%;border-radius:2px}
.ob .p{text-align:right;font-weight:600}
/* match */
.matchup{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.matchup .vs{font-family:"Barlow Condensed";font-size:28px;font-weight:700;text-transform:uppercase;line-height:1}
.wdl{display:flex;height:34px;border-radius:8px;overflow:hidden;margin:14px 0 6px;font:700 14px Barlow;color:#fff}
.wdl div{display:flex;align-items:center;justify-content:center;min-width:0;overflow:hidden;white-space:nowrap}
.legend{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.score{font-family:"Barlow Condensed";font-size:44px;font-weight:800;line-height:1}
/* squad chart */
svg text{font-family:Barlow;fill:var(--muted);font-size:12px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:14px;margin-right:14px;color:var(--muted)}
.chip i{width:10px;height:10px;border-radius:50%}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--paper);padding:8px 10px;border-radius:8px;font-size:13px;line-height:1.35;max-width:240px;z-index:10;opacity:0;transition:opacity .1s}
.tip b{font-family:"Barlow Condensed";font-size:17px}
.stagebar{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:10px 0 4px}
/* tables */
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font:600 12px Barlow;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:6px 4px;border-bottom:1px solid var(--line)}
td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
.pill{display:inline-block;font:700 12px Barlow;padding:2px 7px;border-radius:999px}
.pill.g{background:var(--pitch-soft);color:var(--pitch)} .pill.r{background:var(--red-soft);color:var(--red)} .pill.n{background:var(--paper);color:var(--muted);border:1px solid var(--line)}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:none;color:var(--muted);font:600 13px Barlow;padding:5px 10px;border-radius:999px;cursor:pointer}
.tabs button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);background:var(--paper)}
.scroll{overflow-x:auto}
.foot{color:var(--muted);font-size:14px;border-top:1px solid var(--line);padding:18px 0 40px}
.foot h3{font-size:18px;color:var(--ink);text-transform:uppercase;margin-bottom:6px}
.foot ul{margin:6px 0;padding-left:18px}
.themebtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;width:34px;height:34px;cursor:pointer;font-size:15px}
@media (max-width:820px){
  .s6,.s4,.s8,.s5,.s7{grid-column:span 12}
  .vgrid{grid-template-columns:1fr}
  .hero{grid-template-columns:1fr}
  .posbox{text-align:left;display:flex;align-items:baseline;gap:10px}
  .ob{grid-template-columns:110px 1fr 46px}
  .brand{width:100%}
}
</style>
</head>

i","value_m":17.0}],"xi_share_lost":0.012,"note":""},"history":[{"season":"2016-17","comp":"GB1","pos":2,"ppg":2.26},{"season":"2017-18","comp":"GB1","pos":3,"ppg":2.03},{"season":"2018-19","comp":"GB1","pos":4,"ppg":1.87},{"season":"2019-20","comp":"GB1","pos":6,"ppg":1.55},{"season":"2020-21","comp":"GB1","pos":7,"ppg":1.63},{"season":"2021-22","comp":"GB1","pos":4,"ppg":1.87},{"season":"2022-23","comp":"GB1","pos":8,"ppg":1.58},{"season":"2023-24","comp":"GB1","pos":5,"ppg":1.74},{"season":"2024-25","comp":"GB1","pos":17,"ppg":1.0},{"season":"2025-26","comp":"GB1","pos":17,"ppg":1.08}],"verdict":{"good":[{"title":"The market believes in them","text":"The bookmakers rate them 6th strongest in the league, well above their 20th place."},{"title":"Better than the table says","text":"2 points from chances worth 6. Performances point to a better table position than 20th."},{"title":"Bargains in the squad","text":"Xavi Simons is priced 35% below what his output suggests (€40m vs €62m)."}],"worry":[{"title":"Struggling to create","text":"0.98 expected goals per game (18th of 20)."},{"title":"Out of form","text":"3 defeats in the last 5."},{"title":"Paying for reputation","text":"Cristian Romero is valued at €45m, 111% above what last season's output and minutes suggest."}],"headline":"The market believes in them"}}},"notes":{"value_model_r2":0.84,"value_model_n":1830}}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const $ = s => document.querySelector(s);
const pct = (x, d=0) => x==null ? '–' : (x*100).toFixed(d) + '%';
const pctS = x => { if (x==null) return '–'; const v=x*100; return (v<0.5&&v>0?'<1':v>99.5&&v<100?'>99':Math.round(v))+'%'; };
const sgn = (x, d=1) => (x>0?'+':'') + x.toFixed(d);
const m = x => x==null ? '–' : '€' + (x>=100 ? Math.round(x) : x>=10 ? x.toFixed(0) : x.toFixed(1)) + 'm';
const ord = n => n + (['th','st','nd','rd'][(n%100>10&&n%100<14)?0:(n%10<4?n%10:0)]);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const store = { get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}} };

let league = 'laliga', clubId = null;

function initTheme(){
  const t = store.get('cv-theme'); if (t) document.documentElement.dataset.theme = t;
  $('#theme').onclick = () => {
    const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    const nx = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = nx; store.set('cv-theme', nx); render();
  };
}

function buildLeagueSeg(){
  $('#lg').innerHTML = Object.entries(D.leagues).map(([k,l]) =>
    `<button data-k="${k}" aria-pressed="${k===league}">${l.name}</button>`).join('');
  $('#lg').querySelectorAll('button').forEach(b => b.onclick = () => {
    league = b.dataset.k; clubId = D.leagues[league].order[0]; buildLeagueSeg(); buildSelect(); render();
  });
}
function buildSelect(){
  const L = D.leagues[league];
  $('#club').innerHTML = L.order.map((id,i) => `<option value="${id}" ${id==clubId?'selected':''}>${i+1}. ${esc(D.clubs[id].short)}</option>`).join('');
  $('#club').onchange = e => { clubId = +e.target.value; render(); };
}

function zoneOf(pos, L){ const z = L.zones.find(z => pos>=z[0] && pos<=z[1]); return z ? z[2] : ''; }

function render(){
  const c = D.clubs[clubId], L = D.leagues[league];
  store.set('cv-club', clubId);
  const t = c.table, lk = c.luck, o = c.outlook, n = c.next, sq = c.squad, ab = c.absences, v = c.verdict;
  const N = L.order.length;

  const head = v.headline ? `<span>${esc(v.headline)}.</span>` : '';
  const good = v.good.length ? v.good.map(p => `<div class="pt"><b>${esc(p.title)}</b><p>${esc(p.text)}</p></div>`).join('') : `<div class="empty">Nothing stands out yet.</div>`;
  const bad  = v.worry.length ? v.worry.map(p => `<div class="pt"><b>${esc(p.title)}</b><p>${esc(p.text)}</p></div>`).join('') : `<div class="empty">No red flags in the numbers.</div>`;

  // luck section
  const diff = lk.pts_minus_xpts;
  const luckMsg = Math.abs(diff) < 1.5
    ? ['a', `Points match performance. ${t.pts} points from chances worth ${lk.xpts.toFixed(1)}.`]
    : diff > 0 ? ['a', `${t.pts} points from chances worth ${lk.xpts.toFixed(1)}. Results are ahead of the football; expect some of that to come back.`]
               : ['g', `${t.pts} points from chances worth ${lk.xpts.toFixed(1)}. Performances deserve more; results tend to catch up.`];
  const dotAt = r => `left:${((r-0.5)/N*100).toFixed(2)}%`;
  const ladder = [['League table', t.pos], ['Chances (xPts)', lk.xpts_rank], ['Bookmakers', c.market.rank]]
    .map(([l,r]) => `<div class="lab">${l}</div><div class="track"><div class="dot num" style="${dotAt(r)}">${r}</div></div>`).join('');

  // outlook
  const topLabel = league === 'laliga' || league === 'epl' ? 'Top 4' : 'Top 4';
  const obRows = [['Win the league', o.p_title, 'var(--amber)'], [topLabel+' (UCL)', o.p_ucl, 'var(--pitch)'],
    ['Other Europe', o.p_europe, 'var(--blue)'], ['Mid-table', o.p_mid, 'var(--grey)'], ['Relegation', o.p_releg, 'var(--red)']]
    .map(([l,p,col]) => `<div class="ob"><span>${l}</span><div class="t"><div class="f" style="width:${Math.max(p*100, p>0?0.8:0)}%;background:${col}"></div></div><span class="p num">${pctS(p)}</span></div>`).join('');

  // next match
  let nextHtml = `<p class="sub">No fixture found.</p>`;
  if (n) {
    const d = new Date(n.date + 'T12:00:00');
    const ds = d.toLocaleDateString('en-GB', {weekday:'short', day:'numeric', month:'short'});
    const seg = (p, col, lab) => `<div style="width:${p*100}%;background:${col}">${p>0.09?lab+' '+pct(p):''}</div>`;
    nextHtml = `<div class="matchup"><div class="vs">${n.home?'vs':'at'} ${esc(n.opponent)}</div><div class="eyebrow">${esc(n.round)} · ${ds}${n.time?' · '+n.time:''}</div></div>
      <div class="wdl num">${seg(n.p_win,'var(--pitch)','Win')}${seg(n.p_draw,'var(--grey)','Draw')}${seg(n.p_loss,'var(--red)','Loss')}</div>
      <div class="legend num"><span>Win ${pct(n.p_win)}</span><span>Draw ${pct(n.p_draw)}</span><span>Loss ${pct(n.p_loss)}</span></div>
      <div style="display:flex;gap:16px;align-items:end;margin-top:14px"><div><div class="eyebrow">Most likely score</div><div class="score num">${esc(n.likely)}</div></div>
      <div class="sub" style="margin:0 0 4px">${n.home?c.short+' at home':c.short+' away'}. Model probabilities include the current injury list.</div></div>`;
  }

  // absences
  const absHtml = ab.out.length
    ? `<table><tbody>${ab.out.map(p => `<tr><td>${esc(p.name)}</td><td class="r num">${m(p.value_m)}</td></tr>`).join('')}</tbody></table>
       <div class="callout ${ab.xi_share_lost>=0.08?'r':'a'}">About <b>${pct(ab.xi_share_lost)}</b> of the best XI's value is unavailable.</div>`
    : `<p class="sub">${ab.note ? esc(ab.note[0].toUpperCase()+ab.note.slice(1))+'.' : 'Nobody listed as out.'}</p>`;

  // squad
  const hasVals = sq.curve_index != null;
  const ss = sq.stage_share || {};
  const squadHead = hasVals ? `<div class="kpis">
      <div class="kpi"><div class="v num">${m(sq.total_value_m)}</div><div class="l">Squad value (${ord(sq.value_rank)} of ${sq.ranked_of})</div></div>
      <div class="kpi"><div class="v num">${sq.value_weighted_age.toFixed(1)}</div><div class="l">Value-weighted age</div></div>
      <div class="kpi"><div class="v num" style="color:${sq.curve_index>=0?'var(--pitch)':'var(--red)'}">${sgn(sq.curve_index*100)}%</div><div class="l">Curve index (${ord(sq.curve_rank)} of ${sq.ranked_of})</div></div></div>
      <div class="stagebar"><div style="width:${ss.rising*100}%;background:var(--pitch)"></div><div style="width:${ss.prime*100}%;background:var(--amber)"></div><div style="width:${ss.declining*100}%;background:var(--red)"></div></div>
      <div class="legend num"><span>Rising ${pct(ss.rising)}</span><span>Prime ${pct(ss.prime)}</span><span>Declining ${pct(ss.declining)}</span></div>`
    : `<div class="callout a">Promoted side: squad values in our snapshot are incomplete, so the curve index and value-for-money are not shown.</div>`;

  // value for money
  const vp = sq.players.filter(p => p.vfm != null);

  $('#app').innerHTML = `
  <section class="hero">
    <div>
      <div class="eyebrow">${esc(c.league_name)} · ${esc(L.zone_label)} · data to ${new Date(L.played_up_to).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}</div>
      <h1>${esc(c.name)}</h1>
      <div class="verdict-line">${head}</div>
      <div class="record num"><span><b>${t.w}</b>W <b>${t.d}</b>D <b>${t.l}</b>L</span><span>Goals <b>${t.gf}–${t.ga}</b></span><span class="form">${t.form.map(r=>`<span class="${r}">${r}</span>`).join('')}</span><span>last ${t.form.length}, oldest first</span></div>
    </div>
    <div class="posbox"><div class="big num">${t.pos}<sup>${ord(t.pos).slice(-2)}</sup></div><div class="eyebrow">${t.pts} pts · ${esc(zoneOf(t.pos,L))}</div></div>
  </section>

  <section class="vgrid">
    <div class="vcol good"><h3>What's working</h3>${good}</div>
    <div class="vcol bad"><h3>What's worrying</h3>${bad}</div>
  </section>

  <section class="grid">
    <div class="card s7">
      <h2>Is the table lying?</h2>
      <div class="sub">Points won vs points the chances created were worth (xPts), and where three different views rank the club.</div>
      <div class="kpis">
        <div class="kpi"><div class="v num">${t.pts}</div><div class="l">Points</div></div>
        <div class="kpi"><div class="v num">${lk.xpts.toFixed(1)}</div><div class="l">Expected points</div></div>
        <div class="kpi"><div class="v num" style="color:${diff>1.5?'var(--amber)':diff<-1.5?'var(--pitch)':'inherit'}">${sgn(diff)}</div><div class="l">Luck</div></div>
      </div>
      <div class="ladder">${ladder}<div class="ends"><span>1st</span><span>${ord(N)}</span></div></div>
      <div class="kpis" style="margin-top:16px">
        <div class="kpi"><div class="v num">${lk.xgf_pg.toFixed(2)}</div><div class="l">xG for / game (${ord(lk.att_rank)})</div></div>
        <div class="kpi"><div class="v num">${lk.xga_pg.toFixed(2)}</div><div class="l">xG against / game (${ord(lk.def_rank)})</div></div>
        <div class="kpi"><div class="v num">${t.played}</div><div class="l">Games played</div></div>
      </div>
      <div class="callout ${luckMsg[0]}">${luckMsg[1]}</div>
    </div>
    <div class="card s5">
      <h2>Season outlook</h2>
      <div class="sub">Where the season is likely to end, from 10,000 simulations of the remaining fixtures.</div>
      ${obRows}
      <div class="kpis" style="grid-template-columns:1fr 1fr;margin-top:16px">
        <div class="kpi"><div class="v num">${Math.round(o.exp_points)}</div><div class="l">Expected final points</div></div>
        <div class="kpi"><div class="v num">${o.exp_position.toFixed(1)}</div><div class="l">Expected final position</div></div>
      </div>
    </div>

    <div class="card s7">
      <h2>Next match</h2>
      <div class="sub">Model forecast for ${esc(L.next_round)}.</div>
      ${nextHtml}
    </div>
    <div class="card s5">
      <h2>Missing players</h2>
      <div class="sub">Injured or suspended, with market value.</div>
      ${absHtml}
    </div>

    <div class="card s12">
      <h2>Squad age curve</h2>
      <div class="sub">Each dot is a player: age against how close he is to his expected peak. Bigger dot = higher market value. Hover or tap for details.</div>
      ${squadHead}
      <div id="curve" style="margin-top:14px"></div>
      <div><span class="chip"><i style="background:var(--pitch)"></i>Rising</span><span class="chip"><i style="background:var(--amber)"></i>Prime</span><span class="chip"><i style="background:var(--red)"></i>Declining</span></div>
    </div>

    <div class="card s7">
      <h2>Value for money</h2>
      <div class="sub">Market value vs a fair value predicted from age, position, minutes, output, career and caps. Negative = cheaper than the model expects.</div>
      ${vp.length ? `<div class="tabs" id="vtabs"><button data-s="bargain" aria-pressed="true">Bargains</button><button data-s="pricey" aria-pressed="false">Priciest</button><button data-s="all" aria-pressed="false">All</button></div><div class="scroll" id="vtable"></div>` : `<p class="empty">No value model for this squad.</p>`}
    </div>
    <div class="card s5">
      <h2>Ten seasons</h2>
      <div class="sub">Final league position. Below the line = second tier.</div>
      <div id="hist"></div>
    </div>
  </section>

  <footer class="foot">
    <h3>How this is made</h3>
    <ul>
      <li>Results and match xG from football-data.co.uk; betting odds from the same source; player values and careers from Transfermarkt datasets; player xG from Understat.</li>
      <li>xPts: each match replayed with a Poisson model on its xG. Bookmaker rank comes from a rating fitted to market prices.</li>
      <li>Season outlook and next-match forecast come from our weekly model. It is well calibrated but shows no edge over closing odds, so don't treat it as betting advice.</li>
      <li>Squad values are a June 2026 snapshot; summer transfers after that may be missing. Promoted clubs lack values. The value model explains ${Math.round(D.notes.value_model_r2*100)}% of value differences across ${D.notes.value_model_n.toLocaleString()} players.</li>
      <li>Age curves: attackers and midfielders use an output curve; defenders and keepers use a market value curve. "Prime" means at least 90% of the expected peak.</li>
    </ul>
    <p>Prototype · built ${D.generated}.</p>
  </footer>`;

  drawCurve(sq.players, hasVals);
  drawHist(c.history, c.league === 'laliga' ? 'ES1' : 'GB1');
  if (vp.length) setupVfm(vp);
}

function setupVfm(vp){
  const show = s => {
    let rows = vp.slice();
    if (s === 'bargain') rows = rows.filter(p => p.minutes_2526 >= 600).sort((a,b) => a.vfm - b.vfm).slice(0, 8);
    else if (s === 'pricey') rows = rows.sort((a,b) => b.vfm - a.vfm).slice(0, 8);
    else rows.sort((a,b) => b.value_m - a.value_m);
    $('#vtable').innerHTML = `<table><thead><tr><th>Player</th><th>Pos</th><th class="r">Age</th><th class="r">Value</th><th class="r">Fair</th><th class="r">Gap</th></tr></thead><tbody>${
      rows.map(p => `<tr><td>${esc(p.name)}</td><td>${p.pos}</td><td class="r num">${Math.floor(p.age)}</td><td class="r num">${m(p.value_m)}</td><td class="r num">${m(p.fair_value_m)}</td>
      <td class="r num"><span class="pill ${p.vfm<=-0.15?'g':p.vfm>=0.3?'r':'n'}">${sgn(p.vfm*100,0)}%</span></td></tr>`).join('')}</tbody></table>`;
  };
  document.querySelectorAll('#vtabs button').forEach(b => b.onclick = () => {
    document.querySelectorAll('#vtabs button').forEach(x => x.setAttribute('aria-pressed', x===b)); show(b.dataset.s);
  });
  show('bargain');
}

function drawCurve(players, hasVals){
  const el = $('#curve'); const W = el.clientWidth || 800, H = Math.min(340, Math.max(240, W*0.42));
  const P = {l:40, r:14, t:14, b:32}, iw = W-P.l-P.r, ih = H-P.t-P.b;
  const x0 = 16, x1 = 38, y0 = 0.3, y1 = 1.02;
  const X = a => P.l + (Math.min(Math.max(a,x0),x1)-x0)/(x1-x0)*iw;
  const Y = v => P.t + (1-(Math.max(v,y0)-y0)/(y1-y0))*ih;
  const maxV = Math.max(...players.map(p => p.value_m||0), 1);
  const R = v => 4 + 14*Math.sqrt((v||0)/maxV);
  const col = {rising:css('--pitch'), prime:css('--amber'), declining:css('--red')};
  let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Squad age curve">`;
  s += `<rect x="${P.l}" y="${Y(1.0)}" width="${iw}" height="${Y(0.9)-Y(1.0)}" fill="${css('--amber-soft')}"/>`;
  s += `<text x="${P.l+6}" y="${Y(0.9)-6}">prime zone (≥90% of peak)</text>`;
  for (let a=18; a<=38; a+=4) s += `<line x1="${X(a)}" x2="${X(a)}" y1="${P.t}" y2="${P.t+ih}" stroke="${css('--line')}"/><text x="${X(a)}" y="${H-10}" text-anchor="middle">${a}</text>`;
  for (let v=0.4; v<=1.0001; v+=0.2) s += `<text x="${P.l-6}" y="${Y(v)+4}" text-anchor="end">${Math.round(v*100)}%</text>`;
  s += `<text x="${P.l+iw}" y="${H-10}" text-anchor="end">age →</text>`;
  const sorted = players.slice().sort((a,b) => (b.value_m||0)-(a.value_m||0));
  sorted.forEach((p,i) => {
    s += `<circle data-i="${players.indexOf(p)}" cx="${X(p.age)}" cy="${Y(p.pct_of_peak)}" r="${R(p.value_m)}" fill="${col[p.stage]}" fill-opacity=".72" stroke="${css('--card')}" stroke-width="1.5" style="cursor:pointer"/>`;
  });
  sorted.slice(0, 5).forEach(p => {
    const r = R(p.value_m), right = X(p.age) < P.l + iw*0.8;
    s += `<text x="${X(p.age) + (right ? r+4 : -r-4)}" y="${Y(p.pct_of_peak)+4}" text-anchor="${right?'start':'end'}" style="fill:${css('--ink')};font-weight:600">${esc(p.name.split(' ').slice(-1)[0])}</text>`;
  });
  s += `</svg>`;
  el.innerHTML = s;
  const tip = $('#tip');
  el.querySelectorAll('circle').forEach(cn => {
    const p = players[+cn.dataset.i];
    const showTip = e => {
      tip.innerHTML = `<b>${esc(p.name)}</b><br>${p.pos} · ${p.age.toFixed(1)} yrs · ${p.stage}<br>${Math.round(p.pct_of_peak*100)}% of peak · next year ${sgn(p.next_year*100)}%<br>Value ${m(p.value_m)}${p.fair_value_m?` · fair ${m(p.fair_value_m)}`:''}<br>2025-26: ${p.minutes_2526.toLocaleString()} min, ${p.npga_2526} NP G+A`;
      const pt = e.touches ? e.touches[0] : e;
      tip.style.left = Math.min(pt.clientX + 12, innerWidth - 250) + 'px'; tip.style.top = (pt.clientY + 12) + 'px'; tip.style.opacity = 1;
    };
    cn.addEventListener('mousemove', showTip); cn.addEventListener('click', showTip);
    cn.addEventListener('mouseleave', () => tip.style.opacity = 0);
  });
}

function drawHist(h, top){
  const el = $('#hist'); const W = el.clientWidth || 400, H = 220;
  const P = {l:30, r:10, t:12, b:28}, iw = W-P.l-P.r, ih = H-P.t-P.b;
  const rank = r => r.comp === top ? r.pos : 20 + r.pos;
  const maxR = Math.max(20, ...h.map(rank)); const lo = maxR > 20 ? Math.max(30, maxR) : 20;
  const X = i => P.l + (h.length===1 ? iw/2 : i/(h.length-1)*iw);
  const Y = r => P.t + (r-1)/(lo-1)*ih;
  let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="League position history">`;
  [1,4,10,17,20].filter(v=>v<=lo).forEach(v => s += `<text x="${P.l-6}" y="${Y(v)+4}" text-anchor="end">${v}</text><line x1="${P.l}" x2="${P.l+iw}" y1="${Y(v)}" y2="${Y(v)}" stroke="${css('--line')}" stroke-dasharray="${v===20?'':'2 3'}"/>`);
  s += `<rect x="${P.l}" y="${Y(1)-4}" width="${iw}" height="${Y(4)-Y(1)+8}" fill="${css('--pitch-soft')}" opacity=".7"/>`;
  if (lo > 20) s += `<line x1="${P.l}" x2="${P.l+iw}" y1="${Y(20.5)}" y2="${Y(20.5)}" stroke="${css('--ink')}" stroke-width="1.5"/><text x="${P.l+iw}" y="${Y(20.5)+14}" text-anchor="end">2nd tier</text>`;
  s += `<polyline fill="none" stroke="${css('--ink')}" stroke-width="2" points="${h.map((r,i)=>X(i)+','+Y(rank(r))).join(' ')}"/>`;
  h.forEach((r,i) => {
    const second = r.comp !== top;
    s += `<circle cx="${X(i)}" cy="${Y(rank(r))}" r="${r.pos===1&&!second?7:5}" fill="${r.pos===1&&!second?css('--amber'):second?css('--card'):css('--ink')}" stroke="${css('--ink')}" stroke-width="1.5"><title>${r.season}: ${ord(r.pos)}${second?' (2nd tier)':''}, ${r.ppg.toFixed(2)} pts/game</title></circle>`;
    if (i % 2 === 0 || i === h.length-1) s += `<text x="${X(i)}" y="${H-8}" text-anchor="middle">${r.season.slice(2,4)}/${r.season.slice(-2)}</text>`;
  });
  s += `</svg>`;
  el.innerHTML = s;
}

initTheme();
const saved = +store.get('cv-club');
if (saved && D.clubs[saved]) { clubId = saved; league = D.clubs[saved].league; } else { clubId = D.leagues[league].order[0]; }
buildLeagueSeg(); buildSelect(); render();
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { const c = D.clubs[clubId]; drawCurve(c.squad.players, c.squad.curve_index!=null); drawHist(c.history, c.league==='laliga'?'ES1':'GB1'); bindTip(); }, 150); });
function bindTip(){}
